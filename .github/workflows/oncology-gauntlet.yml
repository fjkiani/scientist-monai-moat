name: Oncology Delivery Gauntlet

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oncology-gauntlet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    name: Oncology deterministic gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out pushed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Resolve comparison range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"
            head="$PUSH_HEAD"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            base="$(git merge-base origin/main "$head")"
          fi
          git merge-base --is-ancestor "$base" "$head"
          if git cat-file -e "$base:.github/workflows/oncology-guardian.yml" 2>/dev/null; then
            bootstrap=false
          else
            bootstrap=true
          fi
          {
            echo "base=$base"
            echo "head=$head"
            echo "bootstrap=$bootstrap"
          } >> "$GITHUB_OUTPUT"

      - name: Run deterministic delivery gauntlet
        id: deterministic
        shell: bash
        env:
          BOOTSTRAP: ${{ steps.range.outputs.bootstrap }}
        run: |
          set +e
          bootstrap_arg=()
          if [[ "$BOOTSTRAP" == "true" ]]; then
            bootstrap_arg+=(--bootstrap)
          fi
          python scripts/oncology_gauntlet.py \
            --repo . \
            --base "${{ steps.range.outputs.base }}" \
            --head "${{ steps.range.outputs.head }}" \
            "${bootstrap_arg[@]}"
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build pinned regression sandbox
        id: sandbox
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/gauntlet
          docker build \
            --file .github/oncology-gauntlet/Dockerfile \
            --tag oncology-gauntlet:${{ github.run_id }} \
            . > artifacts/gauntlet/sandbox-build.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run capability regression tests
        id: regression
        if: steps.sandbox.outputs.exit_code == '0'
        shell: bash
        env:
          BOOTSTRAP: ${{ steps.range.outputs.bootstrap }}
        run: |
          set +e
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 4g \
            --cpus 2 \
            --ulimit nofile=1024:1024 \
            --ulimit fsize=1048576:1048576 \
            --env ONCOLOGY_BOOTSTRAP="$BOOTSTRAP" \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            --tmpfs /candidate/artifacts/audit:rw,noexec,nosuid,size=64m \
            --volume "$GITHUB_WORKSPACE:/candidate:ro" \
            --volume "$GITHUB_WORKSPACE:/guardian:ro" \
            --workdir /candidate \
            oncology-gauntlet:${{ github.run_id }} \
            bash -lc 'if [[ "$ONCOLOGY_BOOTSTRAP" == "true" ]]; then \
                echo "ONE_TIME_BOOTSTRAP runtime delivery check not claimed"; \
              else \
                python -I /guardian/scripts/oncology_runtime_verifier.py \
                  --repo /candidate --run-tests; \
              fi && \
              python -I /guardian/scripts/oncology_trusted_test_runner.py \
              --candidate /candidate \
              /guardian/tests/unit/test_luna16_finetune.py \
              /guardian/tests/unit/test_medsiglip_modal_prod_flip.py \
              /guardian/tests/unit/test_oncology_gauntlet.py' \
            > artifacts/gauntlet/regression.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build silver-platter feedback
        if: always()
        id: feedback
        shell: bash
        env:
          SANDBOX_RC: ${{ steps.sandbox.outputs.exit_code }}
          TEST_RC: ${{ steps.regression.outputs.exit_code }}
        run: |
          {
            cat artifacts/gauntlet/report.md
            echo
            echo "# Regression execution"
            echo
            echo "- Pinned sandbox build exit code: \`${SANDBOX_RC:-not-run}\`"
            echo "- Sandboxed capability regression exit code: \`${TEST_RC:-not-run}\`"
            if [[ "${SANDBOX_RC:-1}" != "0" ]]; then
              echo
              echo '```text'
              tail -n 120 artifacts/gauntlet/sandbox-build.log
              echo '```'
            elif [[ "${TEST_RC:-1}" != "0" ]]; then
              echo
              echo '```text'
              tail -n 240 artifacts/gauntlet/regression.log
              echo '```'
            fi
          } > artifacts/gauntlet/feedback.md
          cat artifacts/gauntlet/feedback.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete gauntlet evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oncology-gauntlet-${{ github.sha }}
          path: artifacts/gauntlet/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce gauntlet verdict
        if: always()
        shell: bash
        env:
          DETERMINISTIC_RC: ${{ steps.deterministic.outputs.exit_code }}
          SANDBOX_RC: ${{ steps.sandbox.outputs.exit_code }}
          TEST_RC: ${{ steps.regression.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ "${DETERMINISTIC_RC:-1}" != "0" ||
                "${SANDBOX_RC:-1}" != "0" ||
                "${TEST_RC:-1}" != "0" ]]; then
            echo "REJECT: deterministic delivery or regression gate failed."
            exit 1
          fi
          echo "PASS: deterministic delivery and regression gates passed."
