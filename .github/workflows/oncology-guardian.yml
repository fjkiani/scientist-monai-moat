name: Oncology Immutable Guardian

# Loaded only from the protected base branch. Static inspection, sandboxed
# candidate execution, and write-capable feedback are isolated in separate jobs.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: oncology-guardian-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Trusted static inspection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      guardian_rc: ${{ steps.guardian.outputs.exit_code }}
    steps:
      - name: Check out trusted base enforcement
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: guardian
          fetch-depth: 0
          persist-credentials: false

      - name: Check out candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run trusted deterministic guardian against candidate
        id: guardian
        shell: bash
        run: |
          set +e
          mkdir -p guardian-output
          python guardian/scripts/oncology_gauntlet.py \
            --repo candidate \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --lock "../guardian/.github/oncology-gauntlet/skill-lock.json" \
            --validator "../guardian/.cursor/skills/oncology-moat-platform/validate_tonight_delivery.py" \
            --report-json "../guardian-output/report.json" \
            --report-md "../guardian-output/report.md"
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload trusted inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oncology-guardian-inspection-${{ github.event.pull_request.number }}
          path: guardian-output/
          if-no-files-found: error
          retention-days: 90

  regression:
    name: Sandboxed trusted regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      regression_rc: ${{ steps.regression.outputs.exit_code }}
    steps:
      - name: Check out trusted base tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: guardian
          persist-credentials: false

      - name: Check out candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: candidate
          persist-credentials: false

      - name: Build trusted regression sandbox
        run: |
          docker build \
            --file guardian/.github/oncology-gauntlet/Dockerfile \
            --tag oncology-guardian:${{ github.run_id }} \
            guardian

      - name: Run protected-base tests against candidate source
        id: regression
        shell: bash
        run: |
          set +e
          mkdir -p candidate/artifacts/audit "$RUNNER_TEMP/oncology-audit"
          mkdir -p guardian-output
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 4g \
            --cpus 2 \
            --ulimit nofile=1024:1024 \
            --ulimit fsize=1048576:1048576 \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            --volume "$RUNNER_TEMP/oncology-audit:/candidate/artifacts/audit:rw" \
            --volume "$GITHUB_WORKSPACE/candidate:/candidate:ro" \
            --volume "$GITHUB_WORKSPACE/guardian:/guardian:ro" \
            --workdir /candidate \
            oncology-guardian:${{ github.run_id }} \
            bash -lc 'python -I /guardian/scripts/oncology_runtime_verifier.py \
              --repo /candidate --run-tests && \
              python -I /guardian/scripts/oncology_trusted_test_runner.py \
              --candidate /candidate \
              /guardian/tests/unit/test_luna16_finetune.py \
              /guardian/tests/unit/test_medsiglip_modal_prod_flip.py \
              /guardian/tests/unit/test_oncology_gauntlet.py' \
            > guardian-output/pytest.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload trusted regression
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oncology-guardian-regression-${{ github.event.pull_request.number }}
          path: guardian-output/
          if-no-files-found: error
          retention-days: 90

  guardian:
    name: Oncology immutable guardian
    if: always()
    needs: [inspect, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check out trusted diagnosis code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: guardian
          persist-credentials: false

      - name: Download trusted inspection
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oncology-guardian-inspection-${{ github.event.pull_request.number }}
          path: inspection

      - name: Download trusted regression
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oncology-guardian-regression-${{ github.event.pull_request.number }}
          path: regression

      - name: Run optional trusted-report-only LLM diagnosis
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ONCOLOGY_REVIEW_MODEL: ${{ vars.ONCOLOGY_REVIEW_MODEL }}
        run: |
          python guardian/scripts/oncology_llm_review.py \
            --repo guardian \
            --report ../inspection/report.json \
            --output ../llm-review.md

      - name: Upload separate advisory diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oncology-advisory-diagnosis-${{ github.event.pull_request.number }}
          path: llm-review.md
          if-no-files-found: warn
          retention-days: 30

      - name: Assemble sanitized immutable response
        if: always()
        env:
          STATIC_RC: ${{ needs.inspect.outputs.guardian_rc }}
          REGRESSION_RC: ${{ needs.regression.outputs.regression_rc }}
        run: |
          python - <<'PY'
          import html
          import os
          from pathlib import Path

          def clean(text: str) -> str:
              text = text.replace("@", "@\u200b")
              escaped = html.escape("".join(c if c.isprintable() or c == "\n" else "�" for c in text))
              return escaped.replace("`", "&#96;")

          report = Path("inspection/report.md")
          pytest_log = Path("regression/pytest.log")
          static_rc = os.getenv("STATIC_RC") or "not-run"
          regression_rc = os.getenv("REGRESSION_RC") or "not-run"
          sections = [
              "<!-- oncology-immutable-guardian -->",
              "# Oncology Immutable Guardian",
              "",
              f"- Static contract exit: `{clean(static_rc)}`",
              f"- Sandboxed trusted regression exit: `{clean(regression_rc)}`",
              "",
          ]
          if report.is_file():
              sections.extend(["## Deterministic contract", report.read_text()[:45000], ""])
          else:
              sections.extend(["## Deterministic contract", "Inspection artifact missing — fail closed.", ""])
          if regression_rc != "0":
              log = clean(pytest_log.read_text()[-12000:] if pytest_log.is_file() else "Regression artifact missing.")
              sections.extend(["## Trusted regression failure", "```text", log, "```", ""])
          sections.extend([
              "> Generated by protected-base enforcement.",
              "> Candidate code ran only in a secretless, networkless, read-only container.",
          ])
          Path("guardian-feedback.md").write_text("\n".join(sections)[:64000] + "\n")
          PY
          cat guardian-feedback.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post/update immutable PR rejection package
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FEEDBACK_PATH: guardian-feedback.md
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- oncology-immutable-guardian -->";
            const body = fs.readFileSync(process.env.FEEDBACK_PATH, "utf8");
            const capped = body.length > 65000
              ? body.slice(0, 64000) + "\n\n_Comment truncated; download the guardian artifact._"
              : body;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo, issue_number }
            );
            const prior = comments.find(
              (comment) =>
                comment.user.type === "Bot" &&
                comment.body &&
                comment.body.includes(marker)
            );
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body: capped,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: capped,
              });
            }

      - name: Enforce immutable guardian verdict
        if: always()
        env:
          GUARDIAN_RC: ${{ needs.inspect.outputs.guardian_rc }}
          REGRESSION_RC: ${{ needs.regression.outputs.regression_rc }}
        run: |
          if [[ "${GUARDIAN_RC:-1}" != "0" || "${REGRESSION_RC:-1}" != "0" ]]; then
            echo "REJECT: static oncology contract or sandboxed trusted regression failed."
            exit 1
          fi
          echo "PASS: protected-base static and sandboxed regression gates accepted the candidate."
